<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Final Hoorah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Cinzel:wght@500;600;700&display=swap">
<style>
  :root{
    --paper: #efe7d5;
    --paper-deep: #e4d9bf;
    --card: #fbf7ec;
    --card-shadow: #c9bb92;
    --ink: #221d14;
    --velvet: #233526;
    --velvet-dark: #17241b;
    --gold: #a97c33;
    --gold-bright: #cfa454;
    --gold-pale: #e7cf9a;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--paper);
    background-image: radial-gradient(ellipse 80% 60% at 50% 30%, var(--paper-deep), transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
  }

  .stage{
    container-type: inline-size;
    position: relative;
    width: min(92vw, 520px);
    aspect-ratio: 480 / 540;
  }

  @media (prefers-reduced-motion: no-preference){
    .stage{ animation: settle 0.9s cubic-bezier(.2,.8,.2,1) both; }
  }
  @keyframes settle{
    from{ opacity: 0; transform: translateY(10px) scale(0.985); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .envelope{
    position: absolute;
    inset: 2%;
    filter: drop-shadow(0 30px 40px rgba(23,30,15,0.22));
  }
  .envelope svg{ width: 100%; height: 100%; display: block; }

  .card{
    position: absolute;
    left: 50%;
    top: 54%;
    width: 78%;
    height: 70%;
    transform: translate(-50%, -46%) scale(0.96) rotate(-2.6deg);
    opacity: 0;
    background: var(--card);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5) inset,
      0 28px 48px -18px rgba(23,30,15,0.38),
      0 2px 10px rgba(23,30,15,0.12);
    border: 1px solid #e8dec2;
    pointer-events: none;
    transition: transform 900ms cubic-bezier(.19,1.05,.26,1) 260ms, opacity 650ms ease 260ms;
  }
  .stage.is-open .card{
    transform: translate(-50%, -50%) scale(1) rotate(-2.6deg);
    opacity: 1;
    pointer-events: auto;
  }

  .stage.is-open .tag,
  .stage.is-open .hero,
  .stage.is-open .middle{ opacity: 1; transform: none; }
  .tag, .hero, .middle{
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 500ms ease, transform 500ms ease;
  }
  .tag{ transition-delay: 520ms; }
  .hero{ transition-delay: 620ms; }
  .middle{ transition-delay: 740ms; }

  .opener{
    position: absolute;
    left: 50%;
    top: 14.5%;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6cqw;
    pointer-events: none;
  }

  .tapCatcher{
    position: fixed;
    inset: 0;
    z-index: 10;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tapCatcher:focus-visible{ outline: 3px solid var(--gold-bright); outline-offset: -6px; }

  .seal-wrap{
    position: relative;
    width: 15cqw;
    aspect-ratio: 1;
  }
  .seal-wrap svg{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .seal-half{
    transition: transform 550ms cubic-bezier(.4,.1,.3,1), opacity 480ms ease;
    transform-origin: 30px 30px;
  }
  .seal-text{
    transition: transform 420ms ease, opacity 380ms ease;
    transform-origin: 30px 30px;
  }
  .stage.is-open .seal-left{ transform: translate(-13px, 9px) rotate(-22deg); opacity: 0; }
  .stage.is-open .seal-right{ transform: translate(13px, 9px) rotate(22deg); opacity: 0; }
  .stage.is-open .seal-text{ transform: scale(0.55); opacity: 0; }

  .crack-flash{
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(231,207,154,0.9), rgba(231,207,154,0) 70%);
    opacity: 0;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference){
    .stage.is-open .crack-flash{ animation: crackFlash 550ms ease-out both; }
  }
  @keyframes crackFlash{
    0%{ opacity: 0; transform: scale(0.6); }
    35%{ opacity: 0.85; transform: scale(1.1); }
    100%{ opacity: 0; transform: scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .tag, .hero, .middle, .seal-half, .seal-text{ transition-duration: 1ms !important; transition-delay: 0ms !important; }
  }

  .tag{
    position: absolute;
    top: 7%;
    right: 8%;
    text-align: center;
  }
  .tag .num{
    font-family: "Cinzel", serif;
    font-weight: 700;
    font-size: 10.5cqw;
    color: var(--velvet);
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .tag .num .ord{
    font-size: 0.42em;
    letter-spacing: 0;
    vertical-align: 0.62em;
    margin-left: 1px;
  }
  .tag .cap{
    display: block;
    margin-top: 2px;
    font-family: "Cinzel", serif;
    font-weight: 500;
    font-size: 2.4cqw;
    letter-spacing: 0.3em;
    color: var(--gold);
  }

  .hero{
    position: absolute;
    left: 6%;
    top: 19.5%;
    width: 92%;
    font-family: "Pinyon Script", cursive;
    font-size: 11.5cqw;
    line-height: 0.95;
    color: var(--velvet);
    transform: rotate(-3deg);
    transform-origin: left center;
    text-wrap: balance;
  }

  .middle{
    position: absolute;
    left: 7%;
    right: 7%;
    top: 52%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4%;
  }

  .stack{
    flex: 0 1 auto;
  }
  .stack .day{
    font-family: "Cinzel", serif;
    font-weight: 500;
    font-size: 2.6cqw;
    letter-spacing: 0.26em;
    color: var(--gold);
    margin: 0 0 3px;
  }
  .stack .date{
    font-family: "Cinzel", serif;
    font-weight: 600;
    font-size: 4.6cqw;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin: 0 0 8px;
    white-space: nowrap;
  }
  .stack .theme{
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 4.4cqw;
    color: var(--velvet);
    margin: 0 0 4px;
    line-height: 1.1;
  }
  .stack .aside{
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 2.8cqw;
    color: var(--gold);
    opacity: 0.85;
    margin: 0;
    white-space: nowrap;
  }

  .glyph{
    flex: 0 0 auto;
    width: 6%;
    align-self: center;
  }
  .glyph svg{ width: 100%; height: 100%; display: block; }

  .info{
    flex: 0 0 auto;
    text-align: right;
  }
  .info .place{
    font-family: "Cinzel", serif;
    font-weight: 500;
    font-size: 2.8cqw;
    letter-spacing: 0.08em;
    color: var(--ink);
    margin: 0 0 9px;
    white-space: nowrap;
  }
  .info a{
    display: inline-block;
    font-family: "Cinzel", serif;
    font-weight: 600;
    font-size: 2.5cqw;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-bright);
    padding-bottom: 2px;
    white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .info a:hover{ color: var(--velvet); border-color: var(--velvet); }
  .info a:focus-visible{ outline: 2px solid var(--gold); outline-offset: 4px; }
</style>
</head>
<body>

<div class="stage">
  <div class="envelope">
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f1dca8"/>
          <stop offset="1" stop-color="#ad7f36"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#304a35"/>
          <stop offset="1" stop-color="#141f17"/>
        </linearGradient>
      </defs>

      <polygon points="200,16 384,200 200,384 16,200" fill="url(#body)" stroke="#a97c33" stroke-width="2"/>
      <polygon points="200,16 384,200 16,200" fill="url(#flap)" stroke="#a97c33" stroke-width="1.5"/>
      <polygon points="200,16 384,200 16,200" fill="none" stroke="#17241b" stroke-width="0.75" opacity="0.25"/>

      <polygon points="200,30 370,200 200,370 30,200" fill="none" stroke="#f1dca8" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.65"/>
    </svg>
  </div>

  <div class="card" aria-hidden="true">
    <div class="tag">
      <span class="num">21<span class="ord">st</span></span>
      <span class="cap">Birthday</span>
    </div>

    <h1 class="hero">Edie &amp; Harry</h1>

    <div class="middle">
      <div class="stack">
        <p class="day">Saturday</p>
        <p class="date">21 November</p>
        <p class="theme">The End of the World</p>
        <p class="aside">&mdash; the final hoorah &mdash;</p>
      </div>

      <div class="glyph">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 2 L23 17 L38 20 L23 23 L20 38 L17 23 L2 20 L17 17 Z" fill="#a97c33"/>
        </svg>
      </div>

      <div class="info">
        <p class="place">OX10 6AX</p>
        <a href="info.html" tabindex="-1">RSVP &amp; Info &rarr;</a>
      </div>
    </div>
  </div>

  <div class="opener" aria-hidden="true">
    <span class="seal-wrap">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <defs>
          <radialGradient id="sealFill" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#7c2634"/>
            <stop offset="55%" stop-color="#591a25"/>
            <stop offset="100%" stop-color="#3b0f18"/>
          </radialGradient>
        </defs>
        <circle class="crack-flash" cx="30" cy="30" r="27"/>
        <path class="seal-half seal-left" d="M30,3 A27,27 0 0,0 30,57 Z" fill="url(#sealFill)" stroke="#e7cf9a" stroke-width="1.4"/>
        <path class="seal-half seal-right" d="M30,3 A27,27 0 0,1 30,57 Z" fill="url(#sealFill)" stroke="#e7cf9a" stroke-width="1.4"/>
        <circle cx="30" cy="30" r="21" fill="none" stroke="#e7cf9a" stroke-width="0.6" opacity="0.45"/>
        <text class="seal-text" x="30" y="37" text-anchor="middle" font-family="Cinzel, serif" font-size="18" fill="#e7cf9a">E&amp;H</text>
      </svg>
    </span>
  </div>
</div>

<button type="button" class="tapCatcher" aria-label="Break the seal and open the invitation"></button>

<script>
  (function(){
    var stage = document.querySelector('.stage');
    var tapCatcher = document.querySelector('.tapCatcher');
    var card = document.querySelector('.card');
    tapCatcher.addEventListener('click', function(){
      stage.classList.add('is-open');
      tapCatcher.disabled = true;
      tapCatcher.style.display = 'none';
      card.removeAttribute('aria-hidden');
      card.querySelector('.info a').removeAttribute('tabindex');
    });
  })();
</script>
</body>
</html>
